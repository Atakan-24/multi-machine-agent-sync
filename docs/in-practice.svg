  <text x="890" y="62" class="t" text-anchor="middle">CLAUDE.md  ·  read by Claude Code and Codex</text>
  <text x="644" y="108" class="l h"># CLAUDE.md – Kali (repo &lt;you&gt;/t480-kali)</text>
  <text x="644" y="140" class="l g">&gt; MANDATORY FOR EVERY AGENT (Claude and Codex):</text>
  <text x="644" y="162" class="l g">&gt; 1. Read this file at the start of every session.</text>
  <text x="644" y="184" class="l g">&gt; 2. Pull first.  3. Record every change here.</text>
  <text x="644" y="220" class="l h">## This machine</text>
  <text x="644" y="246" class="l">- 2026-10-10 (Claude): auto-backup via cron,</text>
  <text x="644" y="266" class="l">  not systemd: --user units don't run as root.</text>
  <text x="644" y="292" class="l">- 2026-10-10 (Claude): 28 projects already have</text>
  <text x="644" y="312" class="l">  their own remote -&gt; sync MANIFEST.md instead.</text>
